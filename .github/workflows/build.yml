name: 自动打包三平台

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests httpx tldextract mmh3 PySide6 openpyxl colorama
          pip install pyinstaller

      - name: Windows 打包
        if: matrix.os == 'windows-latest'
        run: |
          cd mycode
          pyinstaller -w -F --noconsole fp_gui.py --add-data "fp_db.json;."

      - name: Linux 打包
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd mycode
          pyinstaller -w -F fp_gui.py --add-data "fp_db.json:."

      - name: Mac 打包
        if: matrix.os == 'macos-latest'
        run: |
          cd mycode
          pyinstaller -w -F fp_gui.py --add-data "fp_db.json:."

      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: mycode/dist/
