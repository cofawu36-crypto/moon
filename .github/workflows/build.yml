name: 自动打包+测试三平台

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests httpx tldextract mmh3 PySide6 openpyxl colorama
          pip install pyinstaller

      - name: Windows 打包
        if: matrix.os == 'windows-latest'
        run: |
          cd mycode
          pyinstaller -w -F --noconsole fp_gui.py --add-data "fp_db.json;."

      - name: Linux 打包
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd mycode
          pyinstaller -w -F fp_gui.py --add-data "fp_db.json:."

      - name: macOS 打包
        if: matrix.os == 'macos-latest'
        run: |
          cd mycode
          pyinstaller -w -F fp_gui.py --add-data "fp_db.json:."

      # 👇 新增：自动测试macOS程序是否能正常启动
      - name: 测试macOS程序
        if: matrix.os == 'macos-latest'
        run: |
          cd mycode/dist
          chmod +x fp_gui
          # 后台运行程序，等待5秒后检查是否还在运行
          ./fp_gui &
          PID=$!
          sleep 5
          if ps -p $PID > /dev/null; then
            echo "✅ macOS程序启动成功！"
            kill $PID
          else
            echo "❌ macOS程序启动失败！"
            exit 1
          fi

      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: mycode/dist/
